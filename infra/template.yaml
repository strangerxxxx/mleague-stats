AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: M-League stats data pipeline (S3 cache + scheduled scrape)

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "mleague-stats-data-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: ManagedBy
          Value: cursor
        - Key: CreatedBy
          Value: cursor

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadData
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${DataBucket.Arn}/data/*"

  UpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: mleague-stats-update
      Description: Scrape M-League results and write games.json to S3
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      MemorySize: 1024
      Timeout: 900
      CodeUri: ../dist/lambda/
      Environment:
        Variables:
          GAMES_S3_BUCKET: !Ref DataBucket
          GAMES_S3_KEY: data/games.json
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Tags:
        ManagedBy: cursor
        CreatedBy: cursor

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mleague-stats-scheduler
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeUpdateFunction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt UpdateFunction.Arn
      Tags:
        - Key: ManagedBy
          Value: cursor
        - Key: CreatedBy
          Value: cursor

  UpdateFunctionSchedulerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdateFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  EveningRefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: mleague-stats-refresh-2300
      Description: 9-5月の月火木金 23:00 JST
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: cron(0 23 ? 1-5,9-12 MON,TUE,THU,FRI *)
      ScheduleExpressionTimezone: Asia/Tokyo
      State: ENABLED
      Target:
        Arn: !GetAtt UpdateFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  AfterMidnightRefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: mleague-stats-refresh-2400-2500
      Description: 9-5月の月火木金 24:00/25:00 JST（火水金土 0:00と1:00）
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: cron(0 0,1 ? 1-5,9-12 TUE,WED,FRI,SAT *)
      ScheduleExpressionTimezone: Asia/Tokyo
      State: ENABLED
      Target:
        Arn: !GetAtt UpdateFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  AmplifyServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mleague-stats-amplify
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess-Amplify
      Tags:
        - Key: ManagedBy
          Value: cursor
        - Key: CreatedBy
          Value: cursor

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
  DataUrl:
    Value: !Sub "https://${DataBucket}.s3.${AWS::Region}.amazonaws.com/data/games.json"
  UpdateFunctionName:
    Value: !Ref UpdateFunction
  AmplifyServiceRoleArn:
    Value: !GetAtt AmplifyServiceRole.Arn
